<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog's articles</title>
    <style>
        html *{
            margin: 0;
            padding: 0;
            color: black;
        }
        a{
            color: black;
            text-decoration: none;
        }
        a:hover{
            text-decoration: underline;
            color: blue;
        }
        body{
            width: 1200px;
            margin: 0 auto 0;
        }
        .header{
            margin: 0 auto 20px;
            font-size: 40px;
            text-align: center;
        }
        .section{
        }
        ul, li{
            list-style: none;
        }
        .article{
            width: 1200px;
            padding: 10px 0 15px;
            overflow: hidden;
        }
        .article__title{
            font-size: 25px;
            text-align: center;
            margin-bottom: 10px;
        }
        .article__title:hover{
            cursor: pointer;
        }
        .article__div-img{
            display: flex;
            flex-direction: row;
            justify-content: center;
            height: 150px;
            margin-bottom: 15px;
        }
        .article__div-img__img{
            width: 400px;
            height: 100%;
            border: black dotted 1px;
        }
        .article__content{
            width: 100%;
            margin-top: 15px;
            max-height: 50px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .article__footer{
            margin-top: 10px;
            display: flex;
        }
        .article__statistic{
            margin-right: 50px;
        }
        .form-wrapper{
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }
        .form-wrapper__form{
            position: absolute;
            left: 25%;
            top: 25%;
            margin: 0 auto;
            background: white;
            width: 50%;
            display: flex;
            flex-direction: column;
            text-align: center;
            border: black solid 2px;
        }
        .form-wrapper__title{
            font: bold 25px Arial, sans-serif;
        }
        .form-wrapper__element{
            margin: 10px auto 30px;
        }
        .form-wrapper__element__input,
        .form-wrapper__element__input:active,
        .form-wrapper__element__input:focus
        {
            font-size: 20px;
            width: 80%;
            outline: 0;
            border: none;
            border-bottom: 1px solid black;
        }
        .btn{
            font-size: 20px;
            padding: 5px 30px;
            border-radius: 10px;
        }
        .btn:hover{
            background: aquamarine;
        }
        @keyframes blink {
            50% {background: white;}
        }
        .btn__cancel{
            background: yellow;
            /*animation: blink 2s step-end infinite;*/
        }
        .btn_adding_post{
            float: right;
            position: sticky;
            top: 0;
            z-index: 2;
        }
    </style>
</head>

<body>
    <header class="header">Blog page</header>

    <form>
        <p>
            <label for="search">Найти по тегу: </label>
            <input id="search" style="width:300px;" name="search" th:value="${search}">
            <button name="action">&#128269;</button>
        </p>
        <p>
            <label for="pageSize">Число постов: </label>
            <select id="pageSize" name="pageSize" onchange="this.form.submit()">
                <option value="3" th:selected="${paging.pageSize==3}">3</option>
                <option value="5" th:selected="${paging.pageSize==5}">5</option>
                <option value="10" th:selected="${paging.pageSize==10}">10</option>
                <option value="20" th:selected="${paging.pageSize==20}">20</option>
                <option value="50" th:selected="${paging.pageSize==50}">50</option>
                <option value="100" th:selected="${paging.pageSize==100}">100</option>
            </select>
        </p>
        <p>
            <button th:if="${paging.hasPreviousPage}" name="pageNumber" th:value="${paging.pageNumber - 1}">&lt;</button>
            <span th:text="${'Страница: '+paging.pageNumber}"></span>
            <button th:if="${paging.hasNextPage}" name="pageNumber" th:value="${paging.pageNumber+1}">&gt;</button>
        </p>
    </form>

    <button class="btn btn_adding_post" onclick="toggleForm()" id="btn-addPost">Добавить статью в блог</button>
    <section class="section" id="main-section">
        <ul>
            <li th:each="post : ${posts}">
                <article class=" article">
                    <a th:href="@{/blog/{id}(id=${post.id})}">
                        <div class="article__title" th:text="${post.title}"/>
                    </a>

                    <div class="article__div-img">
                        <img class="article__div-img__img" th:src="${post.base64Image}" alt="some picture">
                    </div>

                    <div class="article__content">
                        <span th:text="${post.content}"></span>
                    </div>

                    <div class="article__content">
                        <span th:text="'Теги: '+ ${post.tags}"></span>
                    </div>

                    <div class="article__footer">
                        <div class="article__statistic">
                            <span>лайков: </span>
                            <span th:text="${post.countLike}"></span>
                        </div>

                        <div class="article__statistic">
                            <span>комментариев: </span>
                            <span th:text="${post.countComment}"></span>
                        </div>
                    </div>
                </article>
            </li>
        </ul>
    </section>
    <div class="form-wrapper" id="addPostForm" style="display: none">
        <form class="form-wrapper__form" th:action="@{/blog}" method="post" enctype="multipart/form-data">
            <header class="form-wrapper__element">
                <span class="form-wrapper__title">Добавить статью в блог</span>
            </header>
            <div class="form-wrapper__element">
                <label for="title">Название поста:</label><br>
                <input class="form-wrapper__element__input" type="text" id="title" name="title" required>
            </div>

            <div class="form-wrapper__element">
                <label for="content">Текст поста:</label><br>
                <input class="form-wrapper__element__input" type="text" id="content" name="content" required>
            </div>

            <div class="form-wrapper__element">
                <label for="tag">Теги поста:</label><br>
                <input class="form-wrapper__element__input" type="text" id="tag" name="tags" required>
            </div>

            <div class="form-wrapper__element">
                <label for="image">Картинка:</label>
                <input type="file" id="image" accept="image/*" name="file">
            </div>

            <button class="form-wrapper__element btn" type="submit">Добавить</button>
        </form>
    </div>

    <script>
        function toggleForm() {
            const form = document.getElementById('addPostForm');
            const btn = document.getElementById("btn-addPost");
            const section = document.getElementById("main-section");

             if(form.style.display === 'none'){
                 form.style.display = 'block';
                 btn.innerText = 'Отменить добавление статьи';
                 btn.classList.add("btn__cancel");
                 section.style.opacity = '0.5';
             }else {
                 form.style.display = 'none';
                 btn.innerText = 'Добавить статью в блог';
                 btn.classList.remove("btn__cancel");
                 section.style.opacity = '1';
             }
        }
    </script>

</body>

</html>
