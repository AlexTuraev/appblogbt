services:
  postgres-blog-db:
    image: 'postgres:16.2-alpine'
    container_name: 'postgres-blog-db'
    ports:
      - '5433:5432'
    volumes:
      - './.postgres-data:/var/lib/postgresql/blog/data'
    environment:
      LC_ALL: 'C.UTF-8'
      #    задать пользователя
      POSTGRES_USER: 'admin'
      #    задать пароль
      POSTGRES_PASSWORD: 'admin'
      POSTGRES_DB: 'blog'
      PGDATA: '/var/lib/postgresql/data'
    restart: unless-stopped